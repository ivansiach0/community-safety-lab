[project]
name = "community-safety-api"
version = "0.1.0"
description = "HTTP API for Community Safety Lab"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic==1.20.0",
    "Flask==3.1.3",
    "psycopg[binary]==3.3.6",
    "sqlalchemy==2.1.4",
]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.16.8",
]

[build-system]
requires = ["uv_build>=0.12.20,<0.13"]
build-backend = "uv_build"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]

[tool.pytest.ini_options]
addopts = ["-q"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
