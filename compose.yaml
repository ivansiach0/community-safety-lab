services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: community_safety
      POSTGRES_PASSWORD: community_safety_local
      POSTGRES_USER: community_safety
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U community_safety -d community_safety"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - community_safety_postgres_data:/var/lib/postgresql

volumes:
  community_safety_postgres_data:
